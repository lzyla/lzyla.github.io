<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Lunka Purt Jump</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #gameWrap{position:relative;width:100vw;height:100dvh;background:#87b95e;touch-action:manipulation;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:absolute;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;z-index:5;pointer-events:none}
  .pill{background:#fff9e8eF;color:#253041;border:3px solid #26313e;border-radius:12px;padding:7px 11px;font-weight:900;box-shadow:3px 3px 0 #26313e}
  #controls{position:absolute;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;z-index:6}
  button{min-height:60px;min-width:150px;border:4px solid #26313e;border-radius:15px;background:#fff9e8;color:#26313e;font-size:20px;font-weight:900;box-shadow:0 6px 0 #26313e}
  button:active{transform:translateY(3px);box-shadow:0 3px 0 #26313e}
  #overlay{position:absolute;inset:0;display:grid;place-items:center;background:#0005;z-index:10;padding:18px}
  #card{max-width:620px;text-align:center;background:#fff9e8;color:#253041;border:5px solid #26313e;border-radius:18px;padding:20px;box-shadow:8px 8px 0 #26313e}
  #card h1{margin:0 0 8px;font-size:30px}
  #card p{margin:8px 0 14px;line-height:1.35}
  #start{background:#ffd85a}
  .small{font-size:13px;opacity:.82}
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="pill">⭐ <span id="score">0</span></div>
    <div class="pill">❤️ <span id="lives">3</span></div>
  </div>

  <div id="controls">
    <button id="jumpBtn">⬆ SKOK</button>
    <button id="soundBtn">🔊 DŹWIĘK</button>
  </div>

  <div id="overlay">
    <div id="card">
      <h1>🌾 Lunka: Purt Jump</h1>
      <p>Teraz postacie są zrobione z wyciętych zdjęć. Lunka porusza się po prawej, robi zabawne „purt”, a Ty po lewej przeskakujesz chmurki.</p>
      <button id="start">START</button>
      <p class="small">Najlepiej obrócić telefon poziomo. Dotknij SKOK albo stuknij w ekran.</p>
    </div>
  </div>
</div>

  const r=canvas.getBoundingClientRect();
  DPR=Math.max(1,Math.min(2,devicePixelRatio||1));
  canvas.width=Math.floor(r.width*DPR);
  canvas.height=Math.floor(r.height*DPR);
  W=r.width; H=r.height;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize); resize();

function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function label(t,x,y,s=18){
  ctx.font=`900 ${s}px system-ui,sans-serif`;ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,.92)';ctx.fillText(t,x+2,y+2);
  ctx.fillStyle='#26313e';ctx.fillText(t,x,y);
}

function speechBubble(textValue,cx,cy){
  if(!textValue) return;
  ctx.save();
  ctx.font='900 20px system-ui,sans-serif';
  const padX=16, padY=10;
  const tw=ctx.measureText(textValue).width;
  const bw=tw+padX*2, bh=44;
  const x=cx-bw/2, y=cy-bh;

  ctx.fillStyle='rgba(255,255,255,.96)';
  ctx.strokeStyle='#26313e';
  ctx.lineWidth=3;
  rr(x,y,bw,bh,12);
  ctx.fill(); ctx.stroke();

  // ogonek dymku
  ctx.beginPath();
  ctx.moveTo(cx-10,y+bh);
  ctx.lineTo(cx,y+bh+12);
  ctx.lineTo(cx+8,y+bh);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillStyle='#26313e';
  ctx.fillText(textValue,cx,y+bh/2+1);
  ctx.restore();
}
function drawBg(){
  const gy=ground();

  const sky=ctx.createLinearGradient(0,0,0,gy);
  sky.addColorStop(0,'#8ed3ff');
  sky.addColorStop(1,'#e1f4ff');
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,gy);

  ctx.fillStyle='#ffd86a';
  ctx.beginPath();
  ctx.arc(W*.83,H*.15,Math.max(28,W*.025),0,Math.PI*2);
  ctx.fill();

  function ccloud(cx,cy,s){
    ctx.fillStyle='rgba(255,255,255,.94)';
    ctx.beginPath();
    ctx.arc(cx,cy,24*s,0,Math.PI*2);
    ctx.arc(cx+24*s,cy+4*s,18*s,0,Math.PI*2);
    ctx.arc(cx-22*s,cy+7*s,17*s,0,Math.PI*2);
    ctx.arc(cx+6*s,cy-14*s,20*s,0,Math.PI*2);
    ctx.fill();
  }
  ccloud(W*.18,H*.17,1.05);
  ccloud(W*.46,H*.10,.78);

  // distant hills
  ctx.fillStyle='#8fc66b';
  ctx.beginPath();
  ctx.moveTo(0,gy*.58);
  ctx.quadraticCurveTo(W*.16,gy*.38,W*.32,gy*.57);
  ctx.quadraticCurveTo(W*.50,gy*.34,W*.66,gy*.58);
  ctx.quadraticCurveTo(W*.82,gy*.41,W,gy*.55);
  ctx.lineTo(W,gy);ctx.lineTo(0,gy);ctx.closePath();ctx.fill();

  ctx.fillStyle='#72aa54';
  ctx.beginPath();
  ctx.moveTo(0,gy*.68);
  ctx.quadraticCurveTo(W*.20,gy*.49,W*.40,gy*.67);
  ctx.quadraticCurveTo(W*.60,gy*.46,W*.79,gy*.68);
  ctx.quadraticCurveTo(W*.90,gy*.55,W,gy*.63);
  ctx.lineTo(W,gy);ctx.lineTo(0,gy);ctx.closePath();ctx.fill();

  function house(x,y,s,body,roof){
    ctx.fillStyle=body;ctx.fillRect(x,y,72*s,48*s);
    ctx.fillStyle=roof;
    ctx.beginPath();
    ctx.moveTo(x-8*s,y);ctx.lineTo(x+36*s,y-34*s);ctx.lineTo(x+80*s,y);ctx.closePath();ctx.fill();
    ctx.fillStyle='#dff1ff';
    ctx.fillRect(x+12*s,y+13*s,13*s,14*s);
    ctx.fillRect(x+47*s,y+13*s,13*s,14*s);
    ctx.fillStyle='#724832';ctx.fillRect(x+30*s,y+20*s,13*s,28*s);
  }

  house(W*.55,gy*.51,.78,'#efd49c','#a44d3b');
  house(W*.69,gy*.54,.63,'#f3e1c0','#7b4a32');

  // barn
  const bx=W*.38,by=gy*.56,bs=.78;
  ctx.fillStyle='#bc5c43';ctx.fillRect(bx,by,92*bs,60*bs);
  ctx.fillStyle='#784033';ctx.beginPath();
  ctx.moveTo(bx-10*bs,by);ctx.lineTo(bx+46*bs,by-40*bs);ctx.lineTo(bx+102*bs,by);ctx.closePath();ctx.fill();
  ctx.fillStyle='#eee0bc';ctx.fillRect(bx+34*bs,by+23*bs,24*bs,37*bs);

  function tree(x,y,s){
    ctx.fillStyle='#725238';ctx.fillRect(x-5*s,y,10*s,34*s);
    ctx.fillStyle='#3f7d3a';
    for(const q of [[0,-18,24],[-18,-7,18],[17,-8,19],[0,-37,18]]){
      ctx.beginPath();ctx.arc(x+q[0]*s,y+q[1]*s,q[2]*s,0,Math.PI*2);ctx.fill();
    }
  }
  tree(W*.12,gy*.59,.9);
  tree(W*.22,gy*.62,.7);
  tree(W*.90,gy*.59,.9);

  // meadow
  const field=ctx.createLinearGradient(0,gy*.68,0,H);
  field.addColorStop(0,'#94cf66');
  field.addColorStop(1,'#68aa44');
  ctx.fillStyle=field;ctx.fillRect(0,gy*.68,W,H-gy*.68);

  // country path
  ctx.fillStyle='#d7c49b';
  ctx.beginPath();
  ctx.moveTo(W*.48,gy*.67);ctx.lineTo(W*.56,gy*.67);
  ctx.lineTo(W*.72,H);ctx.lineTo(W*.35,H);
  ctx.closePath();ctx.fill();

  // wooden fence
  ctx.strokeStyle='#8d6c4b';ctx.lineWidth=Math.max(3,W*.0025);
  for(let i=0;i<7;i++){
    const px=W*(.04+i*.145);
    ctx.beginPath();ctx.moveTo(px,gy*.69);ctx.lineTo(px,gy*.82);ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(0,gy*.74);ctx.lineTo(W,gy*.77);
  ctx.moveTo(0,gy*.79);ctx.lineTo(W,gy*.82);
  ctx.stroke();

  // foreground grass
  ctx.fillStyle='rgba(77,144,49,.82)';
  ctx.fillRect(0,gy-24,W,H-gy+24);
  for(let px=0;px<W;px+=16){
    const hh=6+((px/16)%4)*2;
    ctx.fillStyle=(px/16)%2===0?'#3f8235':'#63a443';
    ctx.fillRect(px,gy-hh,2,hh+3);
  }

  // hay bale
  ctx.fillStyle='#c99f52';ctx.beginPath();ctx.arc(W*.72,gy-12,24,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#98703d';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(W*.72,gy-12,15,0,Math.PI*2);ctx.stroke();
}

function drawCutout(img,cx,bottom,w,flip=false,tilt=0,bob=0){
  const ratio=img.naturalWidth && img.naturalHeight ? img.naturalHeight/img.naturalWidth : 1.8;
  const h=w*ratio;
  ctx.save();
  ctx.translate(cx,bottom+bob);
  ctx.rotate(tilt);
  if(flip) ctx.scale(-1,1);
  ctx.shadowColor='rgba(0,0,0,.25)';ctx.shadowBlur=12;ctx.shadowOffsetY=6;
  ctx.drawImage(img,-w/2,-h,w,h);
  ctx.restore();
  return {w,h};
}

function drawLunka(){

function drawCloud(c){
  c.grow=Math.min(1,(c.grow||0)+.08);
  const k=.55+.45*c.grow;
  const r=c.r*k;

  ctx.save();
  ctx.globalAlpha=.88;
  ctx.fillStyle='#a8bc86';
  ctx.beginPath();
  ctx.arc(c.x,c.y,r,0,Math.PI*2);
  ctx.arc(c.x+18*k,c.y-8*k,r*.72,0,Math.PI*2);
  ctx.arc(c.x+31*k,c.y+5*k,r*.56,0,Math.PI*2);
  ctx.arc(c.x-16*k,c.y+6*k,r*.50,0,Math.PI*2);
  ctx.arc(c.x+6*k,c.y+16*k,r*.48,0,Math.PI*2);
  ctx.fill();

  ctx.globalAlpha=.30;
  ctx.fillStyle='#d9e2c2';
  ctx.beginPath();ctx.arc(c.x+2,c.y-3,r*.50,0,Math.PI*2);ctx.fill();
  ctx.restore();

  if(c.hint>0) label('aaa fuj',c.x+6,c.y-35,15);
}

let audio=null;
function ensureAudio(){
  if(!audio) audio=new (AudioContext||webkitAudioContext)();
  if(audio.state==='suspended') audio.resume();
}
function tone(f,d=.1,type='triangle',vol=.03,delay=0){
  if(!S.sound)return;ensureAudio();
  const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(audio.destination);o.start(t);o.stop(t+d);
}
function fart(){
  if(!S.sound)return;ensureAudio();
  const t=audio.currentTime;
  const osc=audio.createOscillator(),g=audio.createGain();
  osc.type='sawtooth';
  osc.frequency.setValueAtTime(92,t);
  osc.frequency.exponentialRampToValueAtTime(45,t+.28);
  g.gain.setValueAtTime(.10,t);
  g.gain.exponentialRampToValueAtTime(.001,t+.30);
  osc.connect(g).connect(audio.destination);osc.start(t);osc.stop(t+.31);
  tone(58,.18,'square',.035,.06);
}

  const w=lunka.drawW || Math.max(95,Math.min(145,W*.095));
  const h=lunka.drawH || w*1.5;

  // backside emission point for the current Lunka cutout
  const startX=lunka.x - w*.30;
  const startY=lunka.y - h*.34;

  clouds.push({
    x:startX,
    y:startY,
    r:10+Math.random()*4,
    vx:-(S.speed+Math.random()*35),
    hint:.7,
    grow:0
  });

  lunka.puff=.26;
  fart();

  for(let i=0;i<10;i++) flecks.push({
    x:startX+(Math.random()*6-3),
    y:startY+(Math.random()*8-4),
    vx:-32-Math.random()*35,
    vy:-20+Math.random()*40,
    a:1,
    r:2.5+Math.random()*4
  });
}

function intersects(a,b){
  return !(a.x+a.w<b.x||a.x>b.x+b.w||a.y+a.h<b.y||a.y>b.y+b.h);
}

function update(dt){
  player.x=W*.18; lunka.x=W*.82; lunka.y=ground();
  player.y+=player.vy*dt; player.vy+=Math.max(1250,H*1.85)*dt;
  if(player.y>=ground()){player.y=ground();player.vy=0;player.onGround=true}

  S.spawn-=dt;
  if(S.spawn<=0){spawn();S.spawn=Math.max(.9,1.55-S.score*.015);S.speed=Math.min(520,S.speed+2)}
  lunka.puff=Math.max(0,lunka.puff-dt);

  for(let i=clouds.length-1;i>=0;i--){
    const c=clouds[i];c.x+=c.vx*dt;c.hint-=dt;
    const pb={x:player.x-48,y:player.y-210,w:96,h:210};
    const cb={x:c.x-c.r-4,y:c.y-c.r-4,w:c.r*2+8,h:c.r*2+8};
    if(intersects(pb,cb)){
      clouds.splice(i,1);S.lives--;livesEl.textContent=S.lives;S.shake=.18;reaction.text='o boże';reaction.timer=1.15;sHit();
      if(S.lives<=0){endGame();return}
      continue;
    }
    if(c.x<-70){clouds.splice(i,1);S.score++;scoreEl.textContent=S.score;reaction.text='ufff';reaction.timer=.9;sPoint()}
  }

  for(let i=flecks.length-1;i>=0;i--){
    const f=flecks[i];f.x+=f.vx*dt;f.y+=f.vy*dt;f.a-=dt*1.8;
    if(f.a<=0)flecks.splice(i,1);
  }
  S.shake=Math.max(0,S.shake-dt);
  reaction.timer=Math.max(0,reaction.timer-dt);
}

function render(){
  ctx.save();
  if(S.shake>0)ctx.translate((Math.random()*2-1)*8*S.shake,(Math.random()*2-1)*5*S.shake);
  drawBg();drawDad();
  for(const c of clouds)drawCloud(c);
  for(const f of flecks){ctx.globalAlpha=Math.max(0,f.a);ctx.fillStyle='#8ea16a';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
  drawLunka();
  ctx.restore();
}

function reset(){
  S.score=0;S.lives=3;S.spawn=.8;S.speed=220;S.shake=0;
  clouds.length=0;flecks.length=0;player.vy=0;player.onGround=true;player.y=ground();reaction.text='';reaction.timer=0;
  scoreEl.textContent='0';livesEl.textContent='3';
}
function start(){ensureAudio();reset();overlay.style.display='none';S.running=true;S.last=performance.now()}
function endGame(){
  S.running=false;overlay.style.display='grid';
  document.querySelector('#card h1').textContent='Koniec gry';
  document.querySelector('#card p').innerHTML=`Wynik: <b>${S.score}</b> punktów.`;
  startBtn.textContent='JESZCZE RAZ';
}
function loop(ts){
  const dt=Math.min(.032,(ts-S.last)/1000||0);S.last=ts;
  if(S.running)update(dt);render();requestAnimationFrame(loop);
}

startBtn.addEventListener('click',start);
jumpBtn.addEventListener('pointerdown',e=>{e.preventDefault();jump()});
canvas.addEventListener('pointerdown',jump);
soundBtn.addEventListener('click',()=>{S.sound=!S.sound;soundBtn.textContent=S.sound?'🔊 DŹWIĘK':'🔇 DŹWIĘK'});
addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();jump()}});

Promise.all([
  new Promise(r=>dadImg.onload=r),
  new Promise(r=>lunkaImg.onload=r)
]).then(()=>{resize();reset();requestAnimationFrame(loop)});
</script>
</div>
</body>
